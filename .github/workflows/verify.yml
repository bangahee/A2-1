name: Verify assignment

on:
  push:
    branches: ["main", "feat/**", "fix/**", "docs/**", "test/**", "refactor/**", "chore/**", "ci/**", "perf/**", "style/**", "build/**", "revert/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check repository conventions
        run: python -m scripts.check_conventions
      - name: Test mathematical implementations
        run: python -m unittest discover -s tests -v
      - name: Regenerate figures and numerical evidence
        run: python -m scripts.run_all
      - name: Execute notebooks from clean kernels
        run: python -m scripts.execute_notebooks
      - name: Verify complete submission
        run: python -m scripts.verify_submission
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-python-${{ matrix.python-version }}
          path: |
            outputs/
            notebooks/
